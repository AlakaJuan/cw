const QMAP = {};
WEEKS.forEach(wk => wk.quiz.forEach((q, i) => { q.id = `w${wk.w}q${i + 1}`; q.week = wk.w; QMAP[q.id] = q; }));
const ALL_QIDS = Object.keys(QMAP);
const weekOf = n => WEEKS.find(x => x.w === n);
const phaseOf = n => PHASES.find(p => n >= p.weeks[0] && n <= p.weeks[1]);
const SUBJ_LABEL = { 0: '雙科綜合', 1: '科目一', 2: '科目二' };

/* ---------- 5. LocalStorage 狀態 ---------- */
const STORE_KEY = 'ipas_ai_planner_24w_v1';
const defaultState = () => ({
  read: {},        // { [週]: true }
  quiz: {},        // { [週]: { answers:{qid:選項}, best, last, attempts, done } }
  wrong: {},       // { [qid]: { count, addedAt } }
  notes: {},       // { [週]: '筆記文字' }
  links: {},       // { [週]: [{title,url,type}] } 使用者自訂講義連結（覆寫預設）
  settings: { folderUrl: DEFAULT_FOLDER_URL },
  openPhases: ['p1'],
  updatedAt: null
});
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaultState();
    const o = JSON.parse(raw), d = defaultState();
    return Object.assign(d, o, { settings: Object.assign(d.settings, o.settings || {}) });
  } catch (e) { return defaultState(); }
}
let S = loadState();
function save() {
  S.updatedAt = Date.now();
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); }
  catch (e) { toast('無法寫入瀏覽器儲存空間（可能為無痕模式）', 'warn'); }
}

/* ---------- 6. 工具函式 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const icon = (n, cls = '') => `<i data-lucide="${n}" class="${cls}"></i>`;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad2 = n => String(n).padStart(2, '0');
const LETTERS = ['A', 'B', 'C', 'D', 'E'];
function safeUrl(u) { u = String(u || '').trim(); return /^https?:\/\//i.test(u) ? u : ''; }
function paint() { if (window.lucide) lucide.createIcons(); }

function qState(w) { return S.quiz[w] || (S.quiz[w] = { answers: {}, best: null, last: null, attempts: 0, done: false }); }
function weekScore(w) { const st = S.quiz[w]; if (!st || !st.done) return null; return st.last; }

function stats() {
  const readN = WEEKS.filter(x => S.read[x.w]).length;
  const quizN = WEEKS.filter(x => S.quiz[x.w]?.done).length;
  const pct = Math.round((readN + quizN) / (WEEKS.length * 2) * 100);
  const bests = WEEKS.map(x => S.quiz[x.w]).filter(q => q?.done && q.best != null).map(q => q.best);
  const avg = bests.length ? Math.round(bests.reduce((a, b) => a + b, 0) / bests.length) : null;
  const wrongN = Object.keys(S.wrong).filter(id => QMAP[id]).length;
  const answered = WEEKS.reduce((s, x) => s + Object.keys(S.quiz[x.w]?.answers || {}).length, 0);
  return { readN, quizN, pct, avg, wrongN, answered };
}
function weekPct(w) { return ((S.read[w] ? 1 : 0) + (S.quiz[w]?.done ? 1 : 0)) * 50; }
function phasePct(p) { let t = 0, n = 0; for (let w = p.weeks[0]; w <= p.weeks[1]; w++) { t += weekPct(w); n++; } return Math.round(t / n); }
function nextWeek() { return WEEKS.find(x => weekPct(x.w) < 100) || null; }
function getLinks(w) {
  if (Array.isArray(S.links[w])) return S.links[w];
  return weekOf(w).links.map(k => RESOURCES[k]).filter(Boolean).map(r => ({ title: r.title, url: r.url, type: r.type }));
}

/* ---------- 7. Toast & Modal ---------- */
function toast(msg, kind = 'ok') {
  const root = $('#toast-root');
  const color = kind === 'ok' ? 'bg-slate-900 text-white' : kind === 'warn' ? 'bg-amber-500 text-white' : 'bg-rose-600 text-white';
  const ic = kind === 'ok' ? 'circle-check' : 'triangle-alert';
  const el = document.createElement('div');
  el.className = `pop mt-16 mx-4 px-4 py-2.5 rounded-2xl shadow-lg text-sm font-medium flex items-center gap-2 ${color}`;
  el.innerHTML = `${icon(ic, 'text-emerald-300')}<span>${esc(msg)}</span>`;
  root.innerHTML = ''; root.appendChild(el); paint();
  clearTimeout(toast._t); toast._t = setTimeout(() => { el.style.transition = 'opacity .3s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 2200);
}

function modal({ title, body = '', confirmText = '確定', cancelText = '取消', danger = false, inputMatch = null, inputPlaceholder = '', onConfirm }) {
  const root = $('#modal-root');
  root.innerHTML = `
  <div class="fixed inset-0 z-50 flex items-end sm:items-center justify-center">
    <div data-m="bg" class="absolute inset-0 bg-slate-900/60 backdrop-blur-sm fade-in"></div>
    <div class="pop relative w-full max-w-md bg-white rounded-t-3xl sm:rounded-3xl p-6 safe-bottom shadow-2xl">
      <div class="w-10 h-1.5 bg-slate-200 rounded-full mx-auto mb-4 sm:hidden"></div>
      <div class="flex items-start gap-3">
        <div class="shrink-0 w-11 h-11 rounded-2xl grid place-items-center text-xl ${danger ? 'bg-rose-50 text-rose-600' : 'bg-emerald-50 text-emerald-600'}">${icon(danger ? 'triangle-alert' : 'info')}</div>
        <div class="min-w-0">
          <h3 class="text-lg font-bold text-slate-900">${esc(title)}</h3>
          <div class="mt-1 text-sm text-slate-600 leading-relaxed">${body}</div>
        </div>
      </div>
      ${inputMatch ? `<input data-m="input" autocomplete="off" class="mt-4 w-full rounded-xl border border-slate-300 px-4 py-3 text-base focus:outline-none focus:ring-2 focus:ring-rose-400" placeholder="${esc(inputPlaceholder)}">` : ''}
      <div class="mt-6 grid grid-cols-2 gap-3">
        <button data-m="cancel" class="tap h-12 rounded-2xl bg-slate-100 text-slate-700 font-semibold">${esc(cancelText)}</button>
        <button data-m="ok" class="tap h-12 rounded-2xl font-semibold text-white ${danger ? 'bg-rose-600' : 'bg-emerald-600'} disabled:opacity-40" ${inputMatch ? 'disabled' : ''}>${esc(confirmText)}</button>
      </div>
    </div>
  </div>`;
  paint();
  const close = () => { root.innerHTML = ''; };
  root.querySelector('[data-m="bg"]').onclick = close;
  root.querySelector('[data-m="cancel"]').onclick = close;
  const ok = root.querySelector('[data-m="ok"]');
  const inp = root.querySelector('[data-m="input"]');
  if (inp) { inp.oninput = () => { ok.disabled = inp.value.trim() !== inputMatch; }; setTimeout(() => inp.focus(), 50); }
  ok.onclick = () => { close(); onConfirm && onConfirm(); };
}

/* ---------- 9. 首頁：學習地圖 ---------- */
function ring(pct, size = 92, stroke = 9) {
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  return `<svg width="${size}" height="${size}" class="-rotate-90">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" stroke="rgba(255,255,255,.12)" stroke-width="${stroke}" fill="none"/>
    <circle class="ring-track" cx="${size/2}" cy="${size/2}" r="${r}" stroke="url(#g1)" stroke-width="${stroke}" fill="none" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#a3e635"/></linearGradient></defs>
  </svg>`;
}

function renderHome() {
  const st = stats(), nx = nextWeek();
  const statItem = (ic, v, l, c) => `<div class="rounded-2xl bg-white/5 border border-white/10 px-3 py-2.5"><div class="flex items-center gap-1.5 text-[11px] text-slate-300">${icon(ic, c)}${l}</div><div class="mt-0.5 font-mono text-lg font-bold text-white">${v}</div></div>`;
  return `
  <section class="relative overflow-hidden bg-slate-900 text-white px-4 pt-5 pb-6 grid-bg">
    <div class="absolute -top-16 -right-16 w-56 h-56 rounded-full bg-emerald-500/25 blur-3xl"></div>
    <div class="absolute -bottom-20 -left-10 w-48 h-48 rounded-full bg-teal-400/15 blur-3xl"></div>
    <div class="relative flex items-center gap-4">
      <div class="relative shrink-0">${ring(st.pct)}
        <div class="absolute inset-0 grid place-items-center text-center"><div><div class="font-mono text-2xl font-bold leading-none whitespace-nowrap">${st.pct}<span class="text-sm">%</span></div><div class="text-[10px] text-slate-400 mt-1">整體完成度</div></div></div>
      </div>
      <div class="min-w-0">
        <div class="text-[11px] font-mono text-emerald-300 tracking-widest">iPAS · AI PLANNER · LV1</div>

        <div class="mt-2 text-xs text-slate-300">研讀 ${st.readN}/24 週 · 測驗 ${st.quizN}/24 週</div>
      </div>
    </div>
    <div class="relative mt-5 grid grid-cols-4 gap-2">
      ${statItem('book-open-check', `${st.readN}`, '已研讀', 'text-emerald-300')}
      ${statItem('list-checks', `${st.quizN}`, '已測驗', 'text-teal-300')}
      ${statItem('trophy', st.avg == null ? '—' : st.avg + '%', '平均分', 'text-lime-300')}
      ${statItem('bookmark-x', `${st.wrongN}`, '待複習', 'text-rose-300')}
    </div>
  </section>

  <section class="px-4 -mt-1 pt-4 space-y-3">
    ${nx ? `
    <a href="#/week/${nx.w}/${S.read[nx.w] ? 'quiz' : 'read'}" class="tap block rounded-3xl bg-gradient-to-br from-emerald-500 to-teal-600 text-white p-4 shadow-glow">
      <div class="flex items-center justify-between text-xs text-emerald-50/90"><span class="flex items-center gap-1.5">${icon('flame')} 繼續學習</span><span class="font-mono">WEEK ${pad2(nx.w)}</span></div>
      <div class="mt-1.5 text-lg font-bold">${esc(nx.title)}</div>
      <div class="mt-3 flex items-center justify-between">
        <span class="text-xs bg-white/20 rounded-full px-2.5 py-1">${S.read[nx.w] ? '下一步：隨行實戰刷題' : '下一步：讀書會知識卡'}</span>
        <span class="w-9 h-9 rounded-full bg-white text-emerald-600 grid place-items-center text-lg">${icon('arrow-right')}</span>
      </div>
    </a>` : `
    <div class="rounded-3xl bg-gradient-to-br from-lime-400 to-emerald-500 text-slate-900 p-4 shadow-glow">
      <div class="text-lg font-black flex items-center gap-2">${icon('party-popper')} 恭喜完成 24 週全部進度！</div>
      <div class="text-sm mt-1">考前記得重刷錯題本，祝金榜題名。</div>
    </div>`}

    <div class="grid grid-cols-2 gap-3">
      <button onclick="startPractice('random')" class="tap rounded-2xl bg-white shadow-card p-3.5 text-left border border-slate-100">
        <div class="w-9 h-9 rounded-xl bg-emerald-50 text-emerald-600 grid place-items-center text-lg">${icon('shuffle')}</div>
        <div class="mt-2 font-bold text-sm">隨機 10 題</div><div class="text-[11px] text-slate-500">全題庫 ${ALL_QIDS.length} 題抽考</div>
      </button>
      <button onclick="startPractice('wrong')" class="tap rounded-2xl bg-white shadow-card p-3.5 text-left border border-slate-100">
        <div class="w-9 h-9 rounded-xl bg-rose-50 text-rose-500 grid place-items-center text-lg">${icon('rotate-ccw')}</div>
        <div class="mt-2 font-bold text-sm">錯題重練</div><div class="text-[11px] text-slate-500">${st.wrongN ? `${st.wrongN} 題待攻克` : '目前沒有錯題'}</div>
      </button>

  <section class="px-4 mt-6">
    <div class="flex items-end justify-between mb-3">
      <h2 class="text-base font-bold text-slate-900 flex items-center gap-2">${icon('route', 'text-emerald-600')} 24 週學習路徑</h2>
      <button onclick="toggleAllPhases()" class="text-xs text-emerald-700 font-semibold">${S.openPhases.length === PHASES.length ? '全部收合' : '全部展開'}</button>
    </div>
    <div class="space-y-3">${PHASES.map(renderPhase).join('')}</div>
    <a href="#/settings" class="tap mt-5 flex items-center justify-center gap-1.5 text-sm font-semibold text-emerald-700">${icon('book-marked')} 第一次使用？查看使用說明</a>
    <p class="text-[11px] text-slate-400 text-center mt-3 leading-relaxed">題目為依官方評鑑範圍自編之模擬樣板題<br>考試規定請以 iPAS 官方簡章公告為準</p>
  </section>`;
}

function renderPhase(p) {
  const open = S.openPhases.includes(p.id), pct = phasePct(p);
  const weeks = WEEKS.filter(x => x.w >= p.weeks[0] && x.w <= p.weeks[1]);
  return `
  <div class="rounded-3xl bg-white shadow-card border border-slate-100 overflow-hidden">
    <button onclick="togglePhase('${p.id}')" class="tap w-full text-left px-4 py-3.5 flex items-center gap-3">
      <div class="relative w-11 h-11 shrink-0 rounded-2xl ${pct === 100 ? 'bg-emerald-500 text-white' : 'bg-slate-900 text-emerald-300'} grid place-items-center font-mono text-xs font-bold">${pct === 100 ? icon('check', 'text-lg') : p.no.replace('Phase ', 'P')}</div>
      <div class="min-w-0 flex-1">
        <div class="text-[11px] text-slate-500 font-medium">${p.no} · W${p.weeks[0]}–W${p.weeks[1]} · ${esc(p.subject)}</div>
        <div class="font-bold text-[15px] text-slate-900 truncate">${esc(p.title)}</div>
        <div class="mt-1.5 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div class="h-full rounded-full bg-gradient-to-r from-emerald-400 to-teal-500" style="width:${pct}%"></div></div>
      </div>
      <div class="text-right shrink-0"><div class="font-mono text-sm font-bold text-emerald-600">${pct}%</div><div class="text-slate-400 transition-transform ${open ? 'rotate-180' : ''}">${icon('chevron-down')}</div></div>
    </button>
    ${open ? `<div class="border-t border-slate-100 divide-y divide-slate-100 fade-in">${weeks.map(renderWeekRow).join('')}</div>` : ''}
  </div>`;
}

function renderWeekRow(x) {
  const read = !!S.read[x.w], q = S.quiz[x.w], done = q?.done, pct = weekPct(x.w);
  const answered = Object.keys(q?.answers || {}).length;
  return `
  <a href="#/week/${x.w}/read" class="tap flex gap-3 px-4 py-3.5 active:bg-slate-50">
    <div class="shrink-0 w-11 text-center">
      <div class="text-[10px] font-mono text-slate-400 leading-none">WEEK</div>
      <div class="font-mono text-xl font-bold ${pct === 100 ? 'text-emerald-600' : 'text-slate-800'}">${pad2(x.w)}</div>
    </div>
    <div class="min-w-0 flex-1">
      <div class="font-semibold text-[15px] text-slate-900 leading-snug">${esc(x.title)}</div>
      <div class="mt-1.5 flex flex-wrap gap-1">${x.keywords.slice(0, 4).map(k => `<span class="text-[10.5px] px-1.5 py-0.5 rounded-md bg-slate-100 text-slate-600">${esc(k)}</span>`).join('')}</div>
      <div class="mt-2 flex items-center gap-3 text-[11.5px]">
        <span class="flex items-center gap-1 ${read ? 'text-emerald-600 font-semibold' : 'text-slate-400'}">${icon(read ? 'book-open-check' : 'book-open')} ${read ? '已研讀' : '未研讀'}</span>
        <span class="flex items-center gap-1 ${done ? 'text-teal-600 font-semibold' : answered ? 'text-amber-600' : 'text-slate-400'}">${icon(done ? 'circle-check' : 'pencil-line')} ${done ? `測驗 ${q.last}%（最佳 ${q.best}%）` : answered ? `作答中 ${answered}/${x.quiz.length}` : `${x.quiz.length} 題未測`}</span>
      </div>
    </div>
    <div class="self-center text-slate-300 text-lg">${icon('chevron-right')}</div>
  </a>`;
}

function togglePhase(id) { const i = S.openPhases.indexOf(id); i >= 0 ? S.openPhases.splice(i, 1) : S.openPhases.push(id); save(); render(); }
function toggleAllPhases() { S.openPhases = S.openPhases.length === PHASES.length ? [] : PHASES.map(p => p.id); save(); render(); }

/* ---------- 10. 週次頁：讀 / 測 / 筆記 ---------- */
let LINK_EDIT = false;
const WIDX = {}; // 每週目前題目索引

function renderWeek(w, tab) {
  const x = weekOf(w); if (!x) return renderNotFound();
  const p = phaseOf(w), read = !!S.read[w], q = S.quiz[w];
  const tabs = [['read', '讀書會知識卡', 'book-open'], ['quiz', '隨行刷題', 'pencil-line'], ['notes', '我的筆記', 'notebook-pen']];
  return `
  <section class="bg-slate-900 text-white px-4 pt-4 pb-5 grid-bg relative overflow-hidden">
    <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-emerald-500/20 blur-3xl"></div>
    <div class="relative">
      <div class="flex items-center gap-2 text-[11px]">
        <span class="font-mono font-bold bg-emerald-400 text-slate-900 rounded-md px-1.5 py-0.5">W${pad2(w)}</span>
        <span class="text-slate-300">${esc(p.no)} · ${esc(SUBJ_LABEL[x.subj])}</span>
        <span class="ml-auto font-mono text-emerald-300">${weekPct(w)}%</span>
      </div>
      <h1 class="mt-2 text-xl font-black leading-snug">${esc(x.title)}</h1>
      <div class="mt-3 space-y-1.5">${x.goals.map(g => `<div class="flex items-start gap-2 text-[13px] text-slate-200"><span class="mt-0.5 text-emerald-400">${icon('target')}</span><span>${esc(g)}</span></div>`).join('')}</div>
      <div class="mt-3 flex flex-wrap gap-1.5">${x.keywords.map(k => `<span class="text-[11px] px-2 py-0.5 rounded-full border border-emerald-400/30 text-emerald-200 bg-emerald-400/10">#${esc(k)}</span>`).join('')}</div>
    </div>
  </section>

  <div class="sticky top-[calc(env(safe-area-inset-top)_+_3.75rem)] z-20 bg-slate-50/95 backdrop-blur px-4 py-2.5 border-b border-slate-200/70">
    <div class="grid grid-cols-3 gap-1 p-1 rounded-2xl bg-slate-200/70">
      ${tabs.map(([k, l, ic]) => `<a href="#/week/${w}/${k}" class="tap flex items-center justify-center gap-1.5 h-9 rounded-xl text-[13px] font-semibold ${tab === k ? 'bg-white text-emerald-700 shadow-sm' : 'text-slate-500'}">${icon(ic)}${l}${k === 'quiz' && q?.done ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>' : ''}${k === 'read' && read ? '<span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>' : ''}</a>`).join('')}
    </div>
  </div>

  <div class="px-4 pt-4 fade-in">
    ${tab === 'quiz' ? renderWeekQuiz(w) : tab === 'notes' ? renderNotes(w) : renderRead(w)}
  </div>`;
}

function linkIcon(t) { return t === 'pdf' ? ['file-text', 'bg-rose-50 text-rose-500', 'PDF'] : t === 'html' ? ['file-code', 'bg-sky-50 text-sky-600', 'HTML'] : t === 'folder' ? ['folder-open', 'bg-amber-50 text-amber-600', '資料夾'] : ['link', 'bg-slate-100 text-slate-600', '連結']; }

function renderRead(w) {
  const x = weekOf(w), read = !!S.read[w], links = getLinks(w), folder = safeUrl(S.settings.folderUrl);
  return `
  <div class="space-y-3">
    ${x.cards.map((c, i) => `
      <article class="rounded-3xl bg-white shadow-card border border-slate-100 p-4">
        <div class="flex items-center gap-2"><span class="w-7 h-7 rounded-lg bg-emerald-50 text-emerald-600 grid place-items-center font-mono text-xs font-bold">${pad2(i + 1)}</span><h3 class="font-bold text-slate-900">${esc(c.t)}</h3></div>
        <p class="mt-2 text-[14.5px] leading-7 text-slate-700">${esc(c.c)}</p>
      </article>`).join('')}

    <article class="rounded-3xl bg-amber-50 border border-amber-200/70 p-4">
      <h3 class="font-bold text-amber-800 flex items-center gap-2">${icon('lightbulb')} 考點提示</h3>
      <ul class="mt-2 space-y-1.5">${x.tips.map(t => `<li class="flex gap-2 text-[14px] leading-6 text-amber-900"><span class="text-amber-500 mt-1">${icon('sparkles')}</span><span>${esc(t)}</span></li>`).join('')}</ul>
    </article>

    <article class="rounded-3xl bg-white shadow-card border border-slate-100 p-4">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-slate-900 flex items-center gap-2">${icon('cloud', 'text-emerald-600')} 講義與雲端資源</h3>
        <button onclick="toggleLinkEdit()" class="tap text-xs font-semibold px-2.5 py-1 rounded-full ${LINK_EDIT ? 'bg-emerald-600 text-white' : 'bg-slate-100 text-slate-600'}">${LINK_EDIT ? '完成' : '編輯連結'}</button>
      </div>
      ${folder ? `<a href="${esc(folder)}" target="_blank" rel="noopener" class="tap mt-3 flex items-center gap-3 rounded-2xl bg-gradient-to-r from-slate-900 to-slate-800 text-white p-3">
        <span class="w-10 h-10 rounded-xl bg-emerald-400 text-slate-900 grid place-items-center text-lg">${icon('hard-drive')}</span>
        <span class="min-w-0 flex-1"><span class="block font-semibold text-sm">讀書會雲端硬碟資料夾</span><span class="block text-[11px] text-slate-400 truncate">可於「設定」頁更換網址</span></span>
        <span class="text-emerald-300">${icon('external-link')}</span></a>` : ''}
      <div class="mt-2 divide-y divide-slate-100">
        ${links.length ? links.map((l, i) => { const [ic, cls, lab] = linkIcon(l.type); const u = safeUrl(l.url); return `
          <div class="flex items-center gap-3 py-2.5">
            <span class="w-10 h-10 shrink-0 rounded-xl grid place-items-center text-lg ${cls}">${icon(ic)}</span>
            <a ${u ? `href="${esc(u)}" target="_blank" rel="noopener"` : ''} class="min-w-0 flex-1">
              <span class="block text-sm font-semibold text-slate-800 leading-snug">${esc(l.title)}</span>
              <span class="block text-[11px] text-slate-400">${lab}${u ? '' : ' · 網址無效'}</span>
            </a>
            ${LINK_EDIT ? `<button onclick="editLink(${w},${i})" class="tap w-9 h-9 rounded-xl bg-slate-100 text-slate-600 grid place-items-center">${icon('pencil')}</button>
                           <button onclick="delLink(${w},${i})" class="tap w-9 h-9 rounded-xl bg-rose-50 text-rose-500 grid place-items-center">${icon('trash-2')}</button>`
                        : `<span class="text-slate-300">${icon('external-link')}</span>`}
          </div>`; }).join('') : '<p class="py-3 text-sm text-slate-400">尚無連結，點「編輯連結」新增。</p>'}
      </div>
      ${LINK_EDIT ? `
      <form onsubmit="addLink(event,${w})" class="mt-3 rounded-2xl bg-slate-50 border border-slate-200 p-3 space-y-2">
        <div class="text-xs font-semibold text-slate-600">新增講義連結</div>
        <input name="title" required placeholder="標題，例如：第 3 週 PDF 講義" class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-[15px] focus:outline-none focus:ring-2 focus:ring-emerald-400">
        <input name="url" required type="url" placeholder="https://drive.google.com/..." class="w-full rounded-xl border border-slate-300 px-3 py-2.5 text-[15px] focus:outline-none focus:ring-2 focus:ring-emerald-400">
        <div class="flex gap-2">
          <select name="type" class="flex-1 rounded-xl border border-slate-300 px-3 py-2.5 text-[15px] bg-white"><option value="pdf">PDF 講義</option><option value="html">HTML 解析</option><option value="folder">雲端資料夾</option><option value="link">其他連結</option></select>
          <button class="tap px-4 rounded-xl bg-emerald-600 text-white font-semibold">${icon('plus')}</button>
        </div>
        ${Array.isArray(S.links[w]) ? `<button type="button" onclick="resetLinks(${w})" class="text-xs text-slate-500 underline">恢復本週預設連結</button>` : ''}
      </form>` : ''}
    </article>

    <button onclick="toggleRead(${w})" class="tap w-full rounded-3xl p-4 flex items-center gap-3 border-2 ${read ? 'bg-emerald-50 border-emerald-500' : 'bg-white border-dashed border-slate-300'}">
      <span class="w-8 h-8 rounded-lg grid place-items-center text-lg ${read ? 'bg-emerald-500 text-white' : 'border-2 border-slate-300 text-transparent'}">${icon('check')}</span>
      <span class="text-left flex-1"><span class="block font-bold ${read ? 'text-emerald-700' : 'text-slate-800'}">本週講義已研讀完成</span><span class="block text-xs text-slate-500">${read ? '已計入整體進度，接著去刷題吧！' : '讀完知識卡與講義後打勾'}</span></span>
    </button>
    ${read ? `<a href="#/week/${w}/quiz" class="tap w-full h-12 rounded-2xl bg-slate-900 text-white font-semibold flex items-center justify-center gap-2">${icon('pencil-line', 'text-emerald-300')} 前往本週刷題（${x.quiz.length} 題）</a>` : ''}
  </div>`;
}

function toggleRead(w) { S.read[w] = !S.read[w]; if (!S.read[w]) delete S.read[w]; save(); toast(S.read[w] ? `Week ${w} 已標記研讀完成` : '已取消研讀標記'); render(); }
function toggleLinkEdit() { LINK_EDIT = !LINK_EDIT; render(); }
function ensureCustom(w) { if (!Array.isArray(S.links[w])) S.links[w] = getLinks(w).map(l => ({ ...l })); }
function addLink(e, w) {
  e.preventDefault(); const f = e.target;
  const url = safeUrl(f.url.value); if (!url) { toast('請輸入 http(s) 開頭的網址', 'warn'); return; }
  ensureCustom(w); S.links[w].push({ title: f.title.value.trim(), url, type: f.type.value }); save(); toast('已新增連結'); render();
}
function delLink(w, i) { ensureCustom(w); S.links[w].splice(i, 1); save(); render(); }
function editLink(w, i) {
  ensureCustom(w); const l = S.links[w][i];
  const t = prompt('連結標題', l.title); if (t === null) return;
  const u = prompt('連結網址（https://…）', l.url); if (u === null) return;
  if (!safeUrl(u)) { toast('網址格式不正確', 'warn'); return; }
  l.title = t.trim() || l.title; l.url = safeUrl(u); save(); toast('已更新連結'); render();
}
function resetLinks(w) { delete S.links[w]; save(); toast('已恢復預設連結'); render(); }

function renderNotes(w) {
  const v = S.notes[w] || '';
  return `
  <div class="rounded-3xl bg-white shadow-card border border-slate-100 p-4">
    <div class="flex items-center justify-between">
      <h3 class="font-bold text-slate-900 flex items-center gap-2">${icon('notebook-pen', 'text-emerald-600')} Week ${pad2(w)} 個人筆記</h3>
      <span id="note-status" class="text-[11px] text-slate-400">${v ? '已儲存於本機' : ''}</span>
    </div>
    <textarea id="note-area" oninput="onNote(${w}, this.value)" rows="12" placeholder="記下讀書會討論重點、易混淆觀念、自己的口訣…&#10;（自動儲存在這台裝置的瀏覽器中）" class="mt-3 w-full rounded-2xl border border-slate-200 bg-slate-50 p-3.5 text-[15px] leading-7 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white">${esc(v)}</textarea>
    <div class="mt-2 text-[11px] text-slate-400 text-right"><span id="note-count">${v.length}</span> 字</div>
  </div>`;
}
let noteTimer;
function onNote(w, v) {
  $('#note-count').textContent = v.length; $('#note-status').textContent = '輸入中…';
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => { if (v.trim()) S.notes[w] = v; else delete S.notes[w]; save(); const s = $('#note-status'); if (s) s.textContent = '✓ 已自動儲存'; }, 500);
}

/* ---------- 11. 刷題引擎（週測驗 / 隨機 / 錯題重練共用） ---------- */
let JUST_PICKED = null;
let SESSION = null; // { title, mode:'random'|'wrong', qids, answers, idx }

function ctx(key) {
  if (key === 'session') return { qids: SESSION.qids, answers: SESSION.answers, idx: SESSION.idx, setIdx: i => SESSION.idx = i };
  const w = +key, st = qState(w);
  return { qids: weekOf(w).quiz.map(q => q.id), answers: st.answers, idx: WIDX[w] ?? firstUnanswered(w), setIdx: i => WIDX[w] = i };
}
function firstUnanswered(w) { const st = S.quiz[w], qs = weekOf(w).quiz; if (st?.done) return qs.length; const i = qs.findIndex(q => st?.answers?.[q.id] == null); return i < 0 ? qs.length : i; }

function renderQuizEngine(key) {
  const c = ctx(key), total = c.qids.length, answeredN = c.qids.filter(id => c.answers[id] != null).length;
  const idx = Math.min(c.idx, total);
  const dots = c.qids.map((id, i) => {
    const a = c.answers[id], ok = a != null && a === QMAP[id].a;
    const cls = a == null ? 'bg-slate-200 text-slate-500' : ok ? 'bg-emerald-500 text-white' : 'bg-rose-500 text-white';
    return `<button onclick="gotoQ('${key}',${i})" class="tap shrink-0 w-8 h-8 rounded-full text-xs font-mono font-bold ${cls} ${i === idx ? 'ring-2 ring-offset-2 ring-slate-900' : ''}">${i + 1}</button>`;
  }).join('');
  const header = `
    <div class="flex items-center justify-between text-xs text-slate-500 mb-2"><span>作答進度 ${answeredN}/${total}</span>${answeredN === total ? `<button onclick="gotoQ('${key}',${total})" class="text-emerald-700 font-semibold">查看成績 ›</button>` : ''}</div>
    <div class="h-1.5 rounded-full bg-slate-200 overflow-hidden"><div class="h-full bg-gradient-to-r from-emerald-400 to-teal-500 transition-all" style="width:${answeredN / total * 100}%"></div></div>
    <div class="mt-3 flex gap-2 overflow-x-auto no-scrollbar py-1 px-1">${dots}</div>`;
  if (idx >= total) return header + renderResult(key, c);
  const id = c.qids[idx], q = QMAP[id], chosen = c.answers[id], done = chosen != null, correct = chosen === q.a;
  const wk = weekOf(q.week);
  return `${header}
  <article class="mt-3 rounded-3xl bg-white shadow-card border border-slate-100 p-4 ${done && !correct && JUST_PICKED === id ? 'shake' : ''}">
    <div class="flex items-center gap-2 text-[11px]">
      <span class="font-mono font-bold text-emerald-700 bg-emerald-50 rounded-md px-1.5 py-0.5">Q${idx + 1}</span>
      <span class="text-slate-400">${key === 'session' ? `W${pad2(q.week)} · ${esc(wk.title)}` : SUBJ_LABEL[wk.subj] + ' · 單選題'}</span>
      ${S.wrong[id] ? `<span class="ml-auto text-rose-500 flex items-center gap-1">${icon('bookmark-x')}錯題本</span>` : ''}
    </div>
    <h3 class="mt-2.5 text-[16px] font-bold leading-7 text-slate-900">${esc(q.q)}</h3>
    <div class="mt-4 space-y-2.5">
      ${q.o.map((opt, i) => {
        let cls = 'bg-white border-slate-200 text-slate-700', badge = 'bg-slate-100 text-slate-500', tail = '';
        if (done) {
          if (i === q.a) { cls = 'bg-emerald-50 border-emerald-500 text-emerald-900'; badge = 'bg-emerald-500 text-white'; tail = `<span class="text-emerald-600 text-lg">${icon('circle-check')}</span>`; }
          else if (i === chosen) { cls = 'bg-rose-50 border-rose-400 text-rose-900'; badge = 'bg-rose-500 text-white'; tail = `<span class="text-rose-500 text-lg">${icon('circle-x')}</span>`; }
          else { cls = 'bg-white border-slate-100 text-slate-400'; }
        }
        return `<button ${done ? 'disabled' : `onclick="pick('${key}','${id}',${i})"`} class="tap w-full text-left flex items-center gap-3 rounded-2xl border-2 px-3.5 py-3 ${cls} ${done ? '' : 'hover:border-emerald-300 active:bg-emerald-50'}">
          <span class="shrink-0 w-7 h-7 rounded-lg grid place-items-center font-mono text-sm font-bold ${badge}">${LETTERS[i]}</span>
          <span class="flex-1 text-[15px] leading-6">${esc(opt)}</span>${tail}</button>`;
      }).join('')}
    </div>
    ${done ? `
    <div class="mt-4 rounded-2xl p-3.5 fade-in ${correct ? 'bg-emerald-50 border border-emerald-200' : 'bg-rose-50 border border-rose-200'}">
      <div class="font-bold flex items-center gap-2 ${correct ? 'text-emerald-700' : 'text-rose-600'}">${icon(correct ? 'party-popper' : 'circle-alert')} ${correct ? '答對了！' : `答錯了，標準答案是 ${LETTERS[q.a]}`}${!correct ? '<span class="ml-auto text-[11px] font-medium text-rose-500">已收錄至錯題本</span>' : ''}</div>
      <p class="mt-1.5 text-[14px] leading-6 text-slate-700"><span class="font-semibold">解析：</span>${esc(q.e)}</p>
    </div>` : ''}
  </article>
  <div class="mt-4 grid grid-cols-2 gap-3">
    <button onclick="gotoQ('${key}',${idx - 1})" ${idx === 0 ? 'disabled' : ''} class="tap h-12 rounded-2xl bg-white border border-slate-200 font-semibold text-slate-600 disabled:opacity-40 flex items-center justify-center gap-1">${icon('chevron-left')} 上一題</button>
    <button onclick="gotoQ('${key}',${idx + 1})" class="tap h-12 rounded-2xl font-semibold flex items-center justify-center gap-1 ${done ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-400'}">${idx === total - 1 ? '查看成績' : '下一題'} ${icon('chevron-right')}</button>
  </div>`;
}

function renderResult(key, c) {
  const total = c.qids.length, right = c.qids.filter(id => c.answers[id] === QMAP[id].a).length;
  const answered = c.qids.filter(id => c.answers[id] != null).length;
  const pct = Math.round(right / total * 100);
  const msg = pct === 100 ? '完美！全部答對' : pct >= 70 ? '達到及格水準，繼續保持' : '再複習一下知識卡，然後重刷一次';
  const st = key !== 'session' ? S.quiz[+key] : null;
  return `
  <article class="mt-3 rounded-3xl bg-slate-900 text-white p-5 grid-bg relative overflow-hidden pop">
    <div class="absolute -top-10 -right-10 w-40 h-40 rounded-full bg-emerald-500/25 blur-3xl"></div>
    <div class="relative flex items-center gap-4">
      <div class="relative">${ring(pct, 96, 10)}<div class="absolute inset-0 grid place-items-center font-mono text-2xl font-bold whitespace-nowrap">${pct}<span class="text-sm">%</span></div></div>
      <div>
        <div class="text-xs text-emerald-300 font-mono tracking-widest">RESULT</div>
        <div class="text-lg font-black mt-0.5">${msg}</div>
        <div class="text-sm text-slate-300 mt-1">答對 ${right} / ${total} 題${answered < total ? `（尚有 ${total - answered} 題未作答）` : ''}</div>
        ${st ? `<div class="text-xs text-slate-400 mt-1">最佳 ${st.best ?? '—'}% · 已刷 ${st.attempts || 0} 次</div>` : ''}
      </div>
    </div>
  </article>
  <div class="mt-3 rounded-3xl bg-white shadow-card border border-slate-100 divide-y divide-slate-100">
    ${c.qids.map((id, i) => { const ok = c.answers[id] === QMAP[id].a, na = c.answers[id] == null; return `
      <button onclick="gotoQ('${key}',${i})" class="tap w-full text-left flex items-start gap-3 px-4 py-3">
        <span class="mt-0.5 text-lg ${na ? 'text-slate-300' : ok ? 'text-emerald-500' : 'text-rose-500'}">${icon(na ? 'circle-dashed' : ok ? 'circle-check' : 'circle-x')}</span>
        <span class="flex-1 text-sm leading-6 text-slate-700 line-clamp-2">${esc(QMAP[id].q)}</span>
      </button>`; }).join('')}
  </div>
  <div class="mt-4 grid grid-cols-2 gap-3">
    <button onclick="${key === 'session' ? `startPractice('${SESSION?.mode || 'random'}')` : `retryWeek(${key})`}" class="tap h-12 rounded-2xl bg-emerald-600 text-white font-semibold flex items-center justify-center gap-2">${icon('rotate-ccw')} 再刷一次</button>
    <a href="#/wrong" class="tap h-12 rounded-2xl bg-white border border-slate-200 font-semibold text-slate-700 flex items-center justify-center gap-2">${icon('bookmark-x', 'text-rose-500')} 前往錯題本</a>
  </div>
  ${key !== 'session' && +key < 24 ? `<a href="#/week/${+key + 1}/read" class="tap mt-3 h-12 rounded-2xl bg-slate-900 text-white font-semibold flex items-center justify-center gap-2">前往 Week ${pad2(+key + 1)} ${icon('arrow-right', 'text-emerald-300')}</a>` : ''}`;
}

function renderWeekQuiz(w) { if (WIDX[w] == null) WIDX[w] = firstUnanswered(w); return renderQuizEngine(String(w)); }

function pick(key, id, opt) {
  const c = ctx(key); if (c.answers[id] != null) return;
  c.answers[id] = opt;
  const q = QMAP[id], correct = opt === q.a;
  if (!correct) { const r = S.wrong[id] || { count: 0, addedAt: Date.now() }; r.count++; r.lastAt = Date.now(); S.wrong[id] = r; if (navigator.vibrate) navigator.vibrate(30); }
  else if (key === 'session' && SESSION.mode === 'wrong' && S.wrong[id]) { delete S.wrong[id]; toast('答對了！已從錯題本移除'); }
  if (key !== 'session') {
    const w = +key, st = qState(w), qs = weekOf(w).quiz;
    if (qs.every(x => st.answers[x.id] != null)) {
      const right = qs.filter(x => st.answers[x.id] === x.a).length, pct = Math.round(right / qs.length * 100);
      st.done = true; st.last = pct; st.best = Math.max(st.best ?? 0, pct); st.attempts = (st.attempts || 0) + 1;
      toast(`Week ${w} 測驗完成：${pct}%`);
    }
  }
  JUST_PICKED = id; save(); render(false); JUST_PICKED = null;
}
function gotoQ(key, i) { const c = ctx(key); c.setIdx(Math.max(0, Math.min(i, c.qids.length))); render(false); window.scrollTo({ top: key === 'session' ? 0 : Math.min(window.scrollY, 240), behavior: 'smooth' }); }
function retryWeek(w) { const st = qState(w); st.answers = {}; st.done = false; WIDX[w] = 0; save(); toast('已重置本週作答，最佳成績會保留'); render(); }

function startPractice(mode) {
  let qids, title;
  if (mode === 'wrong') {
    qids = shuffle(Object.keys(S.wrong).filter(id => QMAP[id]));
    if (!qids.length) { toast('錯題本是空的，太棒了！'); return; }
    title = `錯題重練（${qids.length} 題）`;
  } else { qids = shuffle(ALL_QIDS).slice(0, 10); title = '隨機 10 題'; }
  SESSION = { title, mode, qids, answers: {}, idx: 0 };
  if (location.hash === '#/practice') render(); else location.hash = '#/practice';
}
function renderPractice() {
  if (!SESSION) return `<div class="p-8 text-center text-slate-500">練習已結束。<div class="mt-4"><a class="text-emerald-700 font-semibold" href="#/">回學習地圖</a></div></div>`;
  return `<div class="px-4 pt-4 fade-in">
    <div class="mb-3 rounded-2xl ${SESSION.mode === 'wrong' ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'} border px-3.5 py-2.5 text-[13px] flex items-center gap-2">
      ${icon(SESSION.mode === 'wrong' ? 'rotate-ccw' : 'shuffle')} ${SESSION.mode === 'wrong' ? '答對的題目會自動移出錯題本' : '從 24 週題庫隨機抽出，答錯自動收錄錯題本'}
    </div>${renderQuizEngine('session')}</div>`;
}

/* ---------- 12. 錯題本 ---------- */
let WRONG_FILTER = 'all';
let OPEN_WRONG = null;
function renderWrong() {
  const ids = Object.keys(S.wrong).filter(id => QMAP[id]);
  const filt = ids.filter(id => { const s = weekOf(QMAP[id].week).subj; return WRONG_FILTER === 'all' || (WRONG_FILTER === 's1' && s === 1) || (WRONG_FILTER === 's2' && s !== 1); })
                  .sort((a, b) => QMAP[a].week - QMAP[b].week || a.localeCompare(b));
  const chips = [['all', `全部 ${ids.length}`], ['s1', '科目一'], ['s2', '科目二＋綜合']];
  return `
  <section class="px-4 pt-4">
    <div class="rounded-3xl bg-gradient-to-br from-rose-500 to-pink-600 text-white p-4 shadow-lg">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-white/20 grid place-items-center text-2xl">${icon('bookmark-x')}</div>
        <div class="flex-1"><div class="text-xs text-rose-100">錯題自動收錄 · 答對即可移出</div><div class="text-2xl font-black font-mono">${ids.length} <span class="text-sm font-sans font-bold">題待複習</span></div></div>
      </div>
      <button onclick="startPractice('wrong')" ${ids.length ? '' : 'disabled'} class="tap mt-4 w-full h-11 rounded-2xl bg-white text-rose-600 font-bold disabled:opacity-50 flex items-center justify-center gap-2">${icon('rotate-ccw')} 開始錯題重練</button>
    </div>
    <div class="mt-4 flex gap-2 overflow-x-auto no-scrollbar">
      ${chips.map(([k, l]) => `<button onclick="WRONG_FILTER='${k}';render(false)" class="tap shrink-0 px-3.5 h-8 rounded-full text-[13px] font-semibold ${WRONG_FILTER === k ? 'bg-slate-900 text-white' : 'bg-white border border-slate-200 text-slate-600'}">${l}</button>`).join('')}
    </div>
    <div class="mt-3 space-y-2.5">
      ${filt.length ? filt.map(id => {
        const q = QMAP[id], r = S.wrong[id], open = OPEN_WRONG === id;
        return `
        <article class="rounded-2xl bg-white shadow-card border border-slate-100 overflow-hidden">
          <button onclick="OPEN_WRONG = OPEN_WRONG==='${id}'?null:'${id}'; render(false)" class="tap w-full text-left p-3.5 flex gap-3">
            <span class="shrink-0 font-mono text-[11px] font-bold text-rose-600 bg-rose-50 rounded-md px-1.5 py-0.5 h-fit">W${pad2(q.week)}</span>
            <span class="flex-1 text-[14px] leading-6 text-slate-800 ${open ? '' : 'line-clamp-2'}">${esc(q.q)}</span>
            <span class="shrink-0 text-[11px] text-slate-400 font-mono">×${r.count}</span>
          </button>
          ${open ? `<div class="px-3.5 pb-3.5 fade-in">
            <div class="space-y-1.5">${q.o.map((o, i) => `<div class="flex gap-2 text-[13.5px] leading-6 rounded-xl px-2.5 py-1.5 ${i === q.a ? 'bg-emerald-50 text-emerald-800 font-semibold' : 'text-slate-500'}"><span class="font-mono">${LETTERS[i]}.</span><span class="flex-1">${esc(o)}</span>${i === q.a ? icon('circle-check', 'text-emerald-600 mt-1') : ''}</div>`).join('')}</div>
            <p class="mt-2 text-[13.5px] leading-6 text-slate-700 bg-slate-50 rounded-xl p-2.5"><span class="font-semibold">解析：</span>${esc(q.e)}</p>
            <div class="mt-2.5 flex gap-2">
              <a href="#/week/${q.week}/read" class="tap flex-1 h-10 rounded-xl bg-slate-100 text-slate-700 text-sm font-semibold flex items-center justify-center gap-1.5">${icon('book-open')} 回看知識卡</a>
              <button onclick="masterWrong('${id}')" class="tap flex-1 h-10 rounded-xl bg-emerald-600 text-white text-sm font-semibold flex items-center justify-center gap-1.5">${icon('check')} 已掌握，移出</button>
            </div>
          </div>` : ''}
        </article>`; }).join('')
      : `<div class="text-center py-14"><div class="mx-auto w-16 h-16 rounded-3xl bg-emerald-50 text-emerald-500 grid place-items-center text-3xl">${icon('sparkles')}</div><p class="mt-3 font-semibold text-slate-700">這裡目前沒有錯題</p><p class="text-sm text-slate-400 mt-1">刷題答錯時會自動收錄到這裡</p></div>`}
    </div>
  </section>`;
}
function masterWrong(id) { delete S.wrong[id]; OPEN_WRONG = null; save(); toast('已移出錯題本'); render(false); }

/* ---------- 15. 路由 ---------- */
function parseRoute() {
  const p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (p[0] === 'week' && weekOf(+p[1])) return { name: 'week', w: +p[1], tab: ['read', 'quiz', 'notes'].includes(p[2]) ? p[2] : 'read' };
  if (['wrong', 'library', 'settings', 'practice'].includes(p[0])) return { name: p[0] };
  return { name: 'home' };
}
let lastKey = '';
function render(scrollTop = true) {
  const r = parseRoute(), key = JSON.stringify(r);
  if (key !== lastKey) { LINK_EDIT = false; }
  renderTopbar(r); renderTabbar(r);
  const v = $('#view');
  v.innerHTML = r.name === 'week' ? renderWeek(r.w, r.tab)
    : r.name === 'wrong' ? renderWrong()
    : r.name === 'library' ? renderLibrary()
    : r.name === 'settings' ? renderSettings()
    : r.name === 'practice' ? renderPractice()
    : renderHome();
  paint();
  if (scrollTop && key !== lastKey) window.scrollTo(0, 0);
  lastKey = key;
}
function renderNotFound() { return '<div class="p-8 text-center text-slate-500">找不到此頁面</div>'; }
function goBack() { if (history.length > 1) history.back(); else location.hash = '#/'; }

window.addEventListener('hashchange', () => render());
window.addEventListener('storage', e => { if (e.key === STORE_KEY) { S = loadState(); render(false); } });
render();
