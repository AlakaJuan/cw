<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日文單字練習 - 貓咪陪伴版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', 'Noto Sans JP', sans-serif;
            background-color: #F9F6F0; /* 日式和紙質感背景色 */
            color: #4A4A4A;
        }
        .card-hover {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        /* 隱藏捲軸但可滾動 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col md:flex-row items-center justify-center p-4 gap-8">

    <div class="w-full md:w-1/4 flex flex-col items-center justify-center text-center">
        
        <!-- 學習進度 (貓的上方) -->
        <div class="w-full max-w-[200px] mb-4 bg-white/60 p-4 rounded-2xl shadow-sm border border-gray-100 text-left">
            <h3 class="text-sm font-bold text-gray-700 mb-2">各級達成率</h3>
            <div id="level-progress-container" class="flex flex-col gap-2 text-xs">
                <!-- 進度條會透過 JS 動態產生 -->
            </div>
        </div>

        <!-- SVG 貓咪插圖 (日系三花貓學習版) -->
        <svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="mb-4 drop-shadow-md hover:scale-105 transition-transform duration-300">
            <!-- 柔和的日系圓形背景 -->
            <circle cx="100" cy="100" r="80" fill="#FDF3E7" />
            
            <!-- 日式座墊 (Zabuton) -->
            <path d="M30 165 Q100 185 170 165 Q180 155 160 145 Q100 155 40 145 Q20 155 30 165" fill="#88A096"/>
            <path d="M35 160 Q100 178 165 160 Q170 152 155 145 Q100 152 45 145 Q30 152 35 160" fill="#9FB5AB"/>

            <!-- 胖胖三花貓身體 -->
            <ellipse cx="100" cy="115" rx="55" ry="50" fill="#FFFFFF"/>
            <!-- 橘斑 -->
            <path d="M60 75 Q80 65 95 85 Q70 115 45 95 Z" fill="#F4A261"/>
            <!-- 黑斑 -->
            <path d="M140 75 Q120 65 105 85 Q130 115 155 95 Z" fill="#264653"/>

            <!-- 貓耳 -->
            <polygon points="65,70 45,35 85,55" fill="#F4A261"/>
            <polygon points="63,65 52,45 75,55" fill="#FAD2E1"/>
            <polygon points="135,70 155,35 115,55" fill="#264653"/>
            <polygon points="137,65 148,45 125,55" fill="#FAD2E1"/>

            <!-- 必勝頭巾 (Nejiri Hachimaki) - 加粗版 -->
            <!-- 加粗頭巾本體 -->
            <path d="M46 76 Q100 86 154 76" stroke="#E63946" stroke-width="18" fill="none" stroke-linecap="round"/>
            <!-- 頭巾打結處 -->
            <path d="M142 68 Q160 55 172 72 Q158 85 142 68 Z" fill="#E63946"/>
            <!-- 頭巾飄帶 -->
            <path d="M152 70 Q170 88 165 98 Q155 88 148 78 Z" fill="#E63946"/>
            <!-- 放大並加粗的必勝文字 -->
            <text x="100" y="85" font-family="'Noto Sans JP', 'Noto Sans TC', sans-serif" font-size="13" fill="#FFF" font-weight="900" text-anchor="middle" letter-spacing="2">必勝</text>

            <!-- 臉部 -->
            <!-- 眼睛 (彎彎笑眼) -->
            <path d="M70 100 Q77 93 84 100" stroke="#2A2A2A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <path d="M116 100 Q123 93 130 100" stroke="#2A2A2A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
            <!-- 鼻子 -->
            <polygon points="97,108 103,108 100,111" fill="#E76F51"/>
            <!-- 嘴巴 (ω) -->
            <path d="M92 113 Q96 118 100 113 Q104 118 108 113" stroke="#2A2A2A" stroke-width="2" fill="none" stroke-linecap="round"/>
            <!-- 腮紅 -->
            <ellipse cx="60" cy="110" rx="7" ry="4" fill="#F4978E" opacity="0.6"/>
            <ellipse cx="140" cy="110" rx="7" ry="4" fill="#F4978E" opacity="0.6"/>

            <!-- 貓掌 (壓在書上) -->
            <ellipse cx="75" cy="140" rx="10" ry="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" transform="rotate(20 75 140)"/>
            <ellipse cx="125" cy="140" rx="10" ry="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1" transform="rotate(-20 125 140)"/>
            <!-- 爪子線條 -->
            <line x1="72" y1="145" x2="70" y2="150" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="78" y1="145" x2="80" y2="150" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="122" y1="145" x2="120" y2="150" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="128" y1="145" x2="130" y2="150" stroke="#D1D5DB" stroke-width="1.5" stroke-linecap="round"/>

            <!-- 日式綠茶 (湯呑み) -->
            <rect x="148" y="120" width="18" height="22" rx="3" fill="#D3D3D3"/>
            <path d="M148 135 L166 135" stroke="#7A8B99" stroke-width="2"/> <!-- 杯子花紋 -->
            <ellipse cx="157" cy="120" rx="9" ry="4" fill="#A3C1AD"/> <!-- 抹茶色 -->
            <!-- 熱氣 -->
            <path d="M153 113 Q155 108 152 103" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>
            <path d="M159 110 Q161 105 158 100" stroke="#FFF" stroke-width="1.5" fill="none" opacity="0.7" stroke-linecap="round"/>

            <!-- 書本 -->
            <path d="M45 152 L100 158 L155 152 L145 170 L100 176 L55 170 Z" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
            <line x1="100" y1="158" x2="100" y2="176" stroke="#D1D5DB" stroke-width="1.5"/>
            <line x1="65" y1="162" x2="90" y2="165" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="60" y1="167" x2="85" y2="170" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="110" y1="165" x2="135" y2="162" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="115" y1="170" x2="140" y2="167" stroke="#E5E7EB" stroke-width="2.5" stroke-linecap="round"/>

            <!-- 散落的櫻花瓣 -->
            <path d="M30 80 Q35 75 40 80 Q35 85 30 80 Z" fill="#FFB7B2" opacity="0.8" transform="rotate(45 35 80)"/>
            <path d="M165 40 Q170 35 175 40 Q170 45 165 40 Z" fill="#FFB7B2" opacity="0.8" transform="rotate(-20 170 40)"/>
            <path d="M175 110 Q180 105 185 110 Q180 115 175 110 Z" fill="#FFB7B2" opacity="0.8" transform="rotate(70 180 110)"/>
        </svg>
        <h2 class="text-2xl font-bold text-gray-700 mb-2">一緒に頑張ろう！</h2>
        <p class="text-sm text-gray-500">貓貓陪你一起學日文</p>
        
        <!-- 整體學習進度與清除按鈕 (貓的下方) -->
        <div class="w-full max-w-[200px] mt-4 bg-white/60 p-4 rounded-2xl shadow-sm border border-gray-100">
            <h3 class="text-sm font-bold text-gray-700 mb-1">整體進度</h3>
            <div class="w-full bg-gray-200 rounded-full h-2.5 mb-1 mt-2 overflow-hidden">
                <div id="overall-progress-bar" class="bg-[#A3C1AD] h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
            </div>
            <p id="overall-progress-text" class="text-xs text-gray-500 text-right mb-4">0%</p>
            
            <button onclick="showClearModal()" class="w-full text-xs text-red-400 hover:text-red-500 hover:bg-red-50 py-2 rounded-lg transition-colors border border-red-100">
                🗑️ 清除學習紀錄
            </button>
        </div>
    </div>

    <div class="w-full md:w-2/3 max-w-2xl bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-xl border border-gray-100">
        <!-- 控制列 -->
        <div class="flex justify-between items-center mb-6 border-b pb-4 border-gray-200">
            <h1 class="text-xl font-bold text-gray-800">📖 每日單字練習</h1>
            <div class="flex items-center gap-2">
                <label for="level-select" class="text-sm font-medium text-gray-600">難易度：</label>
                <select id="level-select" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-[#E2C792] focus:border-[#E2C792] block p-2 outline-none">
                    <option value="N5">N5 基礎</option>
                    <option value="N4">N4 初級</option>
                    <option value="N3">N3 中級</option>
                    <option value="N2">N2 進階</option>
                    <option value="N1">N1 高階</option>
                </select>
            </div>
        </div>

        <!-- 卡片顯示區域 -->
        <div id="cards-container" class="flex flex-col gap-4 mb-8">
            <!-- 卡片會透過 JS 動態生成到這裡 -->
        </div>

        <!-- 按鈕區域 -->
        <div class="flex justify-center mt-4">
            <button id="next-btn" class="bg-[#E2C792] hover:bg-[#D4B57E] text-gray-800 font-bold py-3 px-8 rounded-full shadow-lg transform transition active:scale-95 flex items-center gap-2">
                <span>🔄</span> 再學三個
            </button>
        </div>
    </div>

    <!-- 自訂確認視窗 (Modal) -->
    <div id="clear-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full mx-4 shadow-xl transform scale-95 transition-transform">
            <h3 class="text-lg font-bold text-gray-800 mb-2">⚠️ 確認清除紀錄？</h3>
            <p class="text-sm text-gray-600 mb-6">這將會清除您目前所有的「已熟練」單字紀錄，且無法復原。確定要清除嗎？</p>
            <div class="flex justify-end gap-3">
                <button onclick="hideClearModal()" class="px-4 py-2 text-sm font-medium text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">取消</button>
                <button onclick="confirmClearRecords()" class="px-4 py-2 text-sm font-medium text-white bg-red-500 hover:bg-red-600 rounded-lg transition-colors shadow-md">確定清除</button>
            </div>
        </div>
    </div>

    <script>
        // 假資料 (Mock Data) - 擴充版：N5, N4, N3 各 30 個單字
        const vocabDatabase = {
            'N5': [
                { word: '食べる', reading: 'たべる', meaning: '吃', example: '<ruby>毎日<rt>まいにち</rt></ruby>りんごを<ruby>食<rt>た</rt></ruby>べます。', exampleAudio: '毎日りんごを食べます。', exampleMeaning: '每天吃蘋果。' },
                { word: '飲む', reading: 'のむ', meaning: '喝', example: 'お<ruby>水<rt>みず</rt></ruby>を<ruby>飲<rt>の</rt></ruby>みます。', exampleAudio: 'お水を飲みます。', exampleMeaning: '喝水。' },
                { word: '行く', reading: 'いく', meaning: '去', example: '<ruby>明日<rt>あした</rt></ruby>、<ruby>学校<rt>がっこう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きます。', exampleAudio: '明日、学校へ行きます。', exampleMeaning: '明天要去學校。' },
                { word: '見る', reading: 'みる', meaning: '看', example: 'テレビを<ruby>見<rt>み</rt></ruby>ます。', exampleAudio: 'テレビを見ます。', exampleMeaning: '看電視。' },
                { word: '寝る', reading: 'ねる', meaning: '睡覺', example: '<ruby>夜<rt>よる</rt></ruby>10<ruby>時<rt>じ</rt></ruby>に<ruby>寝<rt>ね</rt></ruby>ます。', exampleAudio: '夜10時に寝ます。', exampleMeaning: '晚上10點睡覺。' },
                { word: '買う', reading: 'かう', meaning: '買', example: '<ruby>新<rt>あたら</rt></ruby>しい<ruby>本<rt>ほん</rt></ruby>を<ruby>買<rt>か</rt></ruby>いました。', exampleAudio: '新しい本を買いました。', exampleMeaning: '買了新書。' },
                { word: '読む', reading: 'よむ', meaning: '讀、閱讀', example: '<ruby>本<rt>ほん</rt></ruby>を<ruby>読<rt>よ</rt></ruby>みます。', exampleAudio: '本を読みます。', exampleMeaning: '看書。' },
                { word: '書く', reading: 'かく', meaning: '寫', example: '<ruby>手紙<rt>てがみ</rt></ruby>を<ruby>書<rt>か</rt></ruby>きます。', exampleAudio: '手紙を書きます。', exampleMeaning: '寫信。' },
                { word: '話す', reading: 'はなす', meaning: '說話', example: '<ruby>日本<rt>にほん</rt></ruby><ruby>語<rt>ご</rt></ruby>で<ruby>話<rt>はな</rt></ruby>します。', exampleAudio: '日本語で話します。', exampleMeaning: '用日文說話。' },
                { word: '聞く', reading: 'きく', meaning: '聽', example: '<ruby>音楽<rt>おんがく</rt></ruby>を<ruby>聞<rt>き</rt></ruby>きます。', exampleAudio: '音楽を聞きます。', exampleMeaning: '聽音樂。' },
                { word: '帰る', reading: 'かえる', meaning: '回家、回去', example: '<ruby>家<rt>いえ</rt></ruby>に<ruby>帰<rt>かえ</rt></ruby>ります。', exampleAudio: '家に帰ります。', exampleMeaning: '回家。' },
                { word: '起きる', reading: 'おきる', meaning: '起床', example: '<ruby>朝<rt>あさ</rt></ruby><ruby>六時<rt>ろくじ</rt></ruby>に<ruby>起<rt>お</rt></ruby>きます。', exampleAudio: '朝六時に起きます。', exampleMeaning: '早上六點起床。' },
                { word: '会う', reading: 'あう', meaning: '見面', example: '<ruby>友達<rt>ともだち</rt></ruby>に<ruby>会<rt>あ</rt></ruby>います。', exampleAudio: '友達に会います。', exampleMeaning: '和朋友見面。' },
                { word: '待つ', reading: 'まつ', meaning: '等待', example: 'バスを<ruby>待<rt>ま</rt></ruby>ちます。', exampleAudio: 'バスを待ちます。', exampleMeaning: '等公車。' },
                { word: '泳ぐ', reading: 'およぐ', meaning: '游泳', example: 'プールで<ruby>泳<rt>およ</rt></ruby>ぎます。', exampleAudio: 'プールで泳ぎます。', exampleMeaning: '在游泳池游泳。' },
                { word: '休む', reading: 'やすむ', meaning: '休息、請假', example: '<ruby>学校<rt>がっこう</rt></ruby>を<ruby>休<rt>やす</rt></ruby>みます。', exampleAudio: '学校を休みます。', exampleMeaning: '向學校請假。' },
                { word: '遊ぶ', reading: 'あそぶ', meaning: '玩耍', example: '<ruby>公園<rt>こうえん</rt></ruby>で<ruby>遊<rt>あそ</rt></ruby>びます。', exampleAudio: '公園で遊びます。', exampleMeaning: '在公園玩耍。' },
                { word: '歩く', reading: 'あるく', meaning: '走路', example: '<ruby>駅<rt>えき</rt></ruby>まで<ruby>歩<rt>ある</rt></ruby>きます。', exampleAudio: '駅まで歩きます。', exampleMeaning: '走路到車站。' },
                { word: '大きい', reading: 'おおきい', meaning: '大的', example: '<ruby>大<rt>おお</rt></ruby>きい<ruby>犬<rt>いぬ</rt></ruby>です。', exampleAudio: '大きい犬です。', exampleMeaning: '是隻大狗。' },
                { word: '小さい', reading: 'ちいさい', meaning: '小的', example: '<ruby>小<rt>ちい</rt></ruby>さい<ruby>猫<rt>ねこ</rt></ruby>です。', exampleAudio: '小さい猫です。', exampleMeaning: '是隻小貓。' },
                { word: '新しい', reading: 'あたらしい', meaning: '新的', example: '<ruby>新<rt>あたら</rt></ruby>しい<ruby>車<rt>くるま</rt></ruby>です。', exampleAudio: '新しい車です。', exampleMeaning: '是台新車。' },
                { word: '古い', reading: 'ふるい', meaning: '舊的', example: '<ruby>古<rt>ふる</rt></ruby>い<ruby>本<rt>ほん</rt></ruby>です。', exampleAudio: '古い本です。', exampleMeaning: '是本舊書。' },
                { word: '高い', reading: 'たかい', meaning: '高、貴', example: 'この<ruby>山<rt>やま</rt></ruby>は<ruby>高<rt>たか</rt></ruby>いです。', exampleAudio: 'この山は高いです。', exampleMeaning: '這座山很高。' },
                { word: '安い', reading: 'やすい', meaning: '便宜', example: 'このお<ruby>肉<rt>にく</rt></ruby>は<ruby>安<rt>やす</rt></ruby>いです。', exampleAudio: 'このお肉は安いです。', exampleMeaning: '這塊肉很便宜。' },
                { word: '暑い', reading: 'あつい', meaning: '熱', example: '<ruby>今日<rt>きょう</rt></ruby>は<ruby>暑<rt>あつ</rt></ruby>いです。', exampleAudio: '今日は暑いです。', exampleMeaning: '今天很熱。' },
                { word: '寒い', reading: 'さむい', meaning: '寒冷', example: '<ruby>冬<rt>ふゆ</rt></ruby>は<ruby>寒<rt>さむ</rt></ruby>いです。', exampleAudio: '冬は寒いです。', exampleMeaning: '冬天很冷。' },
                { word: '楽しい', reading: 'たのしい', meaning: '快樂、有趣', example: '<ruby>学校<rt>がっこう</rt></ruby>は<ruby>楽<rt>たの</rt></ruby>しいです。', exampleAudio: '学校は楽しいです。', exampleMeaning: '學校很有趣。' },
                { word: '先生', reading: 'せんせい', meaning: '老師', example: '<ruby>先生<rt>せんせい</rt></ruby>に<ruby>聞<rt>き</rt></ruby>きます。', exampleAudio: '先生に聞きます。', exampleMeaning: '問老師。' },
                { word: '学校', reading: 'がっこう', meaning: '學校', example: '<ruby>学校<rt>がっこう</rt></ruby>へ<ruby>行<rt>い</rt></ruby>きます。', exampleAudio: '学校へ行きます。', exampleMeaning: '去學校。' },
                { word: '友達', reading: 'ともだち', meaning: '朋友', example: '<ruby>友達<rt>ともだち</rt></ruby>と<ruby>遊<rt>あそ</rt></ruby>びます。', exampleAudio: '友達と遊びます。', exampleMeaning: '和朋友一起玩。' }
            ],
            'N4': [
                { word: '調べる', reading: 'しらべる', meaning: '調查、查詢', example: 'インターネットで<ruby>意味<rt>いみ</rt></ruby>を<ruby>調<rt>しら</rt></ruby>べる。', exampleAudio: 'インターネットで意味を調べる。', exampleMeaning: '在網路上查意思。' },
                { word: '集める', reading: 'あつめる', meaning: '收集', example: '<ruby>切手<rt>きって</rt></ruby>を<ruby>集<rt>あつ</rt></ruby>めています。', exampleAudio: '切手を集めています。', exampleMeaning: '我正在收集郵票。' },
                { word: '片付ける', reading: 'かたづける', meaning: '整理、收拾', example: '<ruby>部屋<rt>へや</rt></ruby>を<ruby>綺麗<rt>きれい</rt></ruby>に<ruby>片付<rt>かたづ</rt></ruby>ける。', exampleAudio: '部屋を綺麗に片付ける。', exampleMeaning: '把房間收拾乾淨。' },
                { word: '楽しむ', reading: 'たのしむ', meaning: '享受', example: '<ruby>休日<rt>きゅうじつ</rt></ruby>は<ruby>映画<rt>えいが</rt></ruby>を<ruby>楽<rt>たの</rt></ruby>しみます。', exampleAudio: '休日は映画を楽しみます。', exampleMeaning: '假日時享受看電影。' },
                { word: '思い出す', reading: 'おもいだす', meaning: '想起', example: '<ruby>昔<rt>むかし</rt></ruby>のことを<ruby>思<rt>おも</rt></ruby>い<ruby>出<rt>だ</rt></ruby>した。', exampleAudio: '昔のことを思い出した。', exampleMeaning: '想起了以前的事情。' },
                { word: '答える', reading: 'こたえる', meaning: '回答', example: '<ruby>質問<rt>しつもん</rt></ruby>に<ruby>答<rt>こた</rt></ruby>えます。', exampleAudio: '質問に答えます。', exampleMeaning: '回答問題。' },
                { word: '教える', reading: 'おしえる', meaning: '教導、告訴', example: '<ruby>英語<rt>えいご</rt></ruby>を<ruby>教<rt>おし</rt></ruby>えます。', exampleAudio: '英語を教えます。', exampleMeaning: '教英文。' },
                { word: '忘れる', reading: 'わすれる', meaning: '忘記', example: '<ruby>宿題<rt>しゅくだい</rt></ruby>を<ruby>忘<rt>わす</rt></ruby>れました。', exampleAudio: '宿題を忘れました。', exampleMeaning: '忘記寫作業了。' },
                { word: '覚える', reading: 'おぼえる', meaning: '記住、學會', example: '<ruby>単語<rt>たんご</rt></ruby>を<ruby>覚<rt>おぼ</rt></ruby>えます。', exampleAudio: '単語を覚えます。', exampleMeaning: '記單字。' },
                { word: '考える', reading: 'かんがえる', meaning: '思考', example: '<ruby>将来<rt>しょうらい</rt></ruby>について<ruby>考<rt>かんが</rt></ruby>えます。', exampleAudio: '将来について考えます。', exampleMeaning: '思考關於未來的事。' },

                { word: '譲る', reading: 'ゆずる', meaning: '讓步、出讓', example: '<ruby>お年寄り<rt>おとしより</rt></ruby>に<ruby>席<rt>せき</rt></ruby>を<ruby>譲<rt>ゆず</rt></ruby>る。', exampleAudio: 'お年寄りに席を譲る。', exampleMeaning: '讓座給老人家。' },
                { word: '頼る', reading: 'たよる', meaning: '依靠', example: '<ruby>親<rt>おや</rt></ruby>に<ruby>頼<rt>たよ</rt></ruby>ってばかりはいられない。', exampleAudio: '親に頼ってばかりはいられない。', exampleMeaning: '不能總是依賴父母。' },
                { word: '限界', reading: 'げんかい', meaning: '極限', example: '<ruby>体力<rt>たいりょく</rt></ruby>の<ruby>限界<rt>げんかい</rt></ruby>を<ruby>超<rt>こ</rt></ruby>える。', exampleAudio: '体力の限界を超える。', exampleMeaning: '超越體力的極限。' },
                { word: '覚悟', reading: 'かくご', meaning: '覺悟', example: '<ruby>最悪<rt>さいあく</rt></ruby>の<ruby>事態<rt>じたい</rt></ruby>を<ruby>覚悟<rt>かくご</rt></ruby>する。', exampleAudio: '最悪の事態を覚悟する。', exampleMeaning: '做好面臨最壞情況的覺悟。' },
                { word: '条件', reading: 'じょうけん', meaning: '條件', example: '<ruby>採用<rt>さいよう</rt></ruby>の<ruby>条件<rt>じょうけん</rt></ruby>に<ruby>合<rt>あ</rt></ruby>う。', exampleAudio: '採用の条件に合う。', exampleMeaning: '符合錄用的條件。' }
            ],
            'N1': [
                { word: '懸念', reading: 'けねん', meaning: '擔憂、掛念', example: '<ruby>将来<rt>しょうらい</rt></ruby>への<ruby>懸念<rt>けねん</rt></ruby>を<ruby>示<rt>しめ</rt></ruby>す。', exampleAudio: '将来への懸念を示す。', exampleMeaning: '對未來表示擔憂。' },
                { word: '驚愕', reading: 'きょうがく', meaning: '驚愕', example: '<ruby>驚愕<rt>きょうがく</rt></ruby>の<ruby>事実<rt>じじつ</rt></ruby>が<ruby>判明<rt>はんめい</rt></ruby>した。', exampleAudio: '驚愕の事実が判明した。', exampleMeaning: '弄清了令人驚愕的事實。' },
                { word: '迅速', reading: 'じんそく', meaning: '迅速', example: '<ruby>迅速<rt>じんそく</rt></ruby>な<ruby>対応<rt>たいおう</rt></ruby>を<ruby>心<rt>こころ</rt></ruby>がける。', exampleAudio: '迅速な対応を心がける。', exampleMeaning: '致力於迅速的應對。' },
                { word: '柔軟', reading: 'じゅうなん', meaning: '柔軟、靈活', example: '<ruby>柔軟<rt>じゅうなん</rt></ruby>な<ruby>発想<rt>はっそう</rt></ruby>が<ruby>必要<rt>ひつよう</rt></ruby>だ。', exampleAudio: '柔軟な発想が必要だ。', exampleMeaning: '需要靈活的思維。' },
                { word: '偏見', reading: 'へんけん', meaning: '偏見', example: '<ruby>偏見<rt>へんけん</rt></ruby>を<ruby>持<rt>も</rt></ruby>たずに<ruby>接<rt>せっ</rt></ruby>する。', exampleAudio: '偏見を持たずに接する。', exampleMeaning: '不帶偏見地接觸。' },
                { word: '促進', reading: 'そくしん', meaning: '促進', example: '<ruby>経済<rt>けいざい</rt></ruby><ruby>成長<rt>せいちょう</rt></ruby>を<ruby>促進<rt>そくしん</rt></ruby>する。', exampleAudio: '経済成長を促進する。', exampleMeaning: '促進經濟成長。' },
                { word: '妥協', reading: 'だきょう', meaning: '妥協', example: '<ruby>品質<rt>ひんしつ</rt></ruby>に<ruby>妥協<rt>だきょう</rt></ruby>は<ruby>許<rt>ゆる</rt></ruby>されない。', exampleAudio: '品質に妥協は許されない。', exampleMeaning: '在品質上不容許妥協。' },
                { word: '錯覚', reading: 'さっかく', meaning: '錯覺', example: '<ruby>目<rt>め</rt></ruby>の<ruby>錯覚<rt>さっかく</rt></ruby>を<ruby>起<rt>お</rt></ruby>こす。', exampleAudio: '目の錯覚を起こす。', exampleMeaning: '引起視覺上的錯覺。' },
                { word: '貢献', reading: 'こうけん', meaning: '貢獻', example: '<ruby>社会<rt>しゃかい</rt></ruby>の<ruby>発展<rt>はってん</rt></ruby>に<ruby>貢献<rt>こうけん</rt></ruby>する。', exampleAudio: '社会の発展に貢献する。', exampleMeaning: '為社會的發展做出貢獻。' },
                { word: '緻密', reading: 'ちみつ', meaning: '細緻、綿密', example: '<ruby>緻密<rt>ちみつ</rt></ruby>な<ruby>計画<rt>けいかく</rt></ruby>を<ruby>立<rt>た</rt></ruby>てる。', exampleAudio: '緻密な計画を立てる。', exampleMeaning: '制定細緻的計畫。' },
                { word: '怠る', reading: 'おこたる', meaning: '懈怠、疏忽', example: '<ruby>日々<rt>ひび</rt></ruby>の<ruby>努力<rt>どりょく</rt></ruby>を<ruby>怠<rt>おこた</rt></ruby>る。', exampleAudio: '日々の努力を怠る。', exampleMeaning: '疏於日常的努力。' },
                { word: '妨げる', reading: 'さまたげる', meaning: '妨礙', example: '<ruby>交通<rt>こうつう</rt></ruby>を<ruby>妨<rt>さまた</rt></ruby>げる<ruby>行為<rt>こうい</rt></ruby>。', exampleAudio: '交通を妨げる行為。', exampleMeaning: '妨礙交通的行為。' },
                { word: '促す', reading: 'うながす', meaning: '促使、催促', example: '<ruby>注意<rt>ちゅうい</rt></ruby>を<ruby>促<rt>うなが</rt></ruby>す。', exampleAudio: '注意を促す。', exampleMeaning: '提醒注意。' },
                { word: '覆す', reading: 'くつがえす', meaning: '推翻', example: '<ruby>常識<rt>じょうしき</rt></ruby>を<ruby>根底<rt>こんてい</rt></ruby>から<ruby>覆<rt>くつがえ</rt></ruby>す。', exampleAudio: '常識を根底から覆す。', exampleMeaning: '從根本推翻常識。' },
                { word: '伴う', reading: 'ともなう', meaning: '伴隨', example: '<ruby>大<rt>おお</rt></ruby>きな<ruby>危険<rt>きけん</rt></ruby>を<ruby>伴<rt>ともな</rt></ruby>う<ruby>作業<rt>さぎょう</rt></ruby>。', exampleAudio: '大きな危険を伴う作業。', exampleMeaning: '伴隨巨大危險的作業。' },
                { word: '匹敵', reading: 'ひってき', meaning: '匹敵', example: 'プロに<ruby>匹敵<rt>ひってき</rt></ruby>する<ruby>腕前<rt>うでまえ</rt></ruby>。', exampleAudio: 'プロに匹敵する腕前。', exampleMeaning: '與職業選手匹敵的手腕。' },
                { word: '該当', reading: 'がいとう', meaning: '符合、相當於', example: '<ruby>条件<rt>じょうけん</rt></ruby>に<ruby>該当<rt>がいとう</rt></ruby>する<ruby>人<rt>ひと</rt></ruby>。', exampleAudio: '条件に該当する人。', exampleMeaning: '符合條件的人。' },
                { word: '蓄積', reading: 'ちくせき', meaning: '累積', example: '<ruby>疲労<rt>ひろう</rt></ruby>が<ruby>蓄積<rt>ちくせき</rt></ruby>している。', exampleAudio: '疲労が蓄積している。', exampleMeaning: '疲勞正在累積。' },
                { word: '慕う', reading: 'したう', meaning: '愛慕、景仰', example: '<ruby>恩師<rt>おんし</rt></ruby>を<ruby>慕<rt>した</rt></ruby>って<ruby>集<rt>あつ</rt></ruby>まる。', exampleAudio: '恩師を慕って集まる。', exampleMeaning: '景仰恩師而聚集。' },
                { word: '潤う', reading: 'うるおう', meaning: '濕潤、寬裕', example: '<ruby>恵<rt>めぐ</rt></ruby>みの<ruby>雨<rt>あめ</rt></ruby>で<ruby>大地<rt>だいち</rt></ruby>が<ruby>潤<rt>うるお</rt></ruby>う。', exampleAudio: '恵みの雨で大地が潤う。', exampleMeaning: '久旱逢甘霖，大地得到了滋潤。' },
                { word: '渋い', reading: 'しぶい', meaning: '苦澀、雅致', example: '<ruby>渋<rt>しぶ</rt></ruby>いお<ruby>茶<rt>ちゃ</rt></ruby>を<ruby>飲<rt>の</rt></ruby>む。', exampleAudio: '渋いお茶を飲む。', exampleMeaning: '喝苦澀的茶。' },
                { word: '著しい', reading: 'いちじるしい', meaning: '顯著的', example: '<ruby>技術<rt>ぎじゅつ</rt></ruby>の<ruby>進歩<rt>しんぽ</rt></ruby>が<ruby>著<rt>いちじる</rt></ruby>しい。', exampleAudio: '技術の進歩が著しい。', exampleMeaning: '技術進步非常顯著。' },
                { word: '乏しい', reading: 'とぼしい', meaning: '匱乏、不足', example: '<ruby>資金<rt>しきん</rt></ruby>が<ruby>乏<rt>とぼ</rt></ruby>しい。', exampleAudio: '資金が乏しい。', exampleMeaning: '資金匱乏。' },
                { word: '紛らわしい', reading: 'まぎらわしい', meaning: '容易混淆的', example: '<ruby>名前<rt>なまえ</rt></ruby>が<ruby>似<rt>に</rt></ruby>ていて<ruby>紛<rt>まぎ</rt></ruby>らわしい。', exampleAudio: '名前が似ていて紛らわしい。', exampleMeaning: '名字很像，容易混淆。' },
                { word: '煩わしい', reading: 'わずらわしい', meaning: '繁瑣、麻煩', example: '<ruby>煩<rt>わずら</rt></ruby>わしい<ruby>手続<rt>てつづ</rt></ruby>き。', exampleAudio: '煩わしい手続き。', exampleMeaning: '繁瑣的手續。' },
                { word: '丘陵', reading: 'きゅうりょう', meaning: '丘陵', example: 'なだらかな<ruby>丘陵<rt>きゅうりょう</rt></ruby><ruby>地帯<rt>ちたい</rt></ruby>。', exampleAudio: 'なだらかな丘陵地帯。', exampleMeaning: '平緩的丘陵地帶。' },
                { word: '軌道', reading: 'きどう', meaning: '軌道、正軌', example: '<ruby>事業<rt>じぎょう</rt></ruby>が<ruby>軌道<rt>きどう</rt></ruby>に<ruby>乗<rt>の</rt></ruby>る。', exampleAudio: '事業が軌道に乗る。', exampleMeaning: '事業步入正軌。' },
                { word: '誇張', reading: 'こちょう', meaning: '誇張', example: '<ruby>話<rt>はなし</rt></ruby>を<ruby>誇張<rt>こちょう</rt></ruby>して<ruby>伝<rt>つた</rt></ruby>える。', exampleAudio: '話を誇張して伝える。', exampleMeaning: '誇張地傳達事情。' },
                { word: '没頭', reading: 'ぼっとう', meaning: '埋頭、專心致志', example: '<ruby>研究<rt>けんきゅう</rt></ruby>に<ruby>没頭<rt>ぼっとう</rt></ruby>する。', exampleAudio: '研究に没頭する。', exampleMeaning: '專心致志於研究。' },
                { word: '模索', reading: 'もさく', meaning: '摸索', example: '<ruby>新<rt>あたら</rt></ruby>しい<ruby>解決策<rt>かいけつさく</rt></ruby>を<ruby>模索<rt>もさく</rt></ruby>する。', exampleAudio: '新しい解決策を模索する。', exampleMeaning: '摸索新的解決方案。' }
            ]
        };

        const cardsContainer = document.getElementById('cards-container');
        const levelSelect = document.getElementById('level-select');
        const nextBtn = document.getElementById('next-btn');

        let masteredWords = new Set();
        const levels = ['N5', 'N4', 'N3', 'N2', 'N1'];

        // 更新進度顯示
        function updateProgressDisplay() {
            const levelContainer = document.getElementById('level-progress-container');
            levelContainer.innerHTML = '';
            
            let totalWords = 0;
            let totalMastered = 0;

            levels.forEach(lvl => {
                const wordsInLevel = vocabDatabase[lvl] || [];
                const totalLevelWords = wordsInLevel.length;
                totalWords += totalLevelWords;

                const masteredInLevel = wordsInLevel.filter(item => masteredWords.has(item.word)).length;
                totalMastered += masteredInLevel;

                const percentage = totalLevelWords === 0 ? 0 : Math.round((masteredInLevel / totalLevelWords) * 100);

                levelContainer.innerHTML += `
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="text-gray-600 font-medium">${lvl}</span>
                            <span class="text-gray-500">${percentage}%</span>
                        </div>
                        <div class="w-full bg-gray-100 rounded-full h-1.5 overflow-hidden">
                            <div class="bg-[#E2C792] h-1.5 rounded-full transition-all duration-300" style="width: ${percentage}%"></div>
                        </div>
                    </div>
                `;
            });

            // 更新整體進度
            const overallPercentage = totalWords === 0 ? 0 : Math.round((totalMastered / totalWords) * 100);
            document.getElementById('overall-progress-bar').style.width = `${overallPercentage}%`;
            document.getElementById('overall-progress-text').innerText = `${overallPercentage}%`;
        }

        // 切換熟練狀態
        function toggleMastered(word, checkboxElement) {
            if (checkboxElement.checked) {
                masteredWords.add(word);
            } else {
                masteredWords.delete(word);
            }
            updateProgressDisplay();
        }

        // Modal 控制邏輯
        function showClearModal() {
            const modal = document.getElementById('clear-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // 小動畫效果
            setTimeout(() => {
                modal.querySelector('div').classList.remove('scale-95');
                modal.querySelector('div').classList.add('scale-100');
            }, 10);
        }

        function hideClearModal() {
            const modal = document.getElementById('clear-modal');
            modal.querySelector('div').classList.remove('scale-100');
            modal.querySelector('div').classList.add('scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 200);
        }

        function confirmClearRecords() {
            masteredWords.clear();
            updateProgressDisplay();
            
            // 取消畫面上已經打勾的 checkbox
            document.querySelectorAll('.mastered-checkbox').forEach(cb => {
                cb.checked = false;
            });
            
            hideClearModal();
        }

        // 發音功能 (Web Speech API)
        function speak(text) {
            if (!('speechSynthesis' in window)) {
                alert("抱歉，您的瀏覽器不支援語音朗讀功能。");
                return;
            }
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ja-JP'; // 設定為日文
            utterance.rate = 0.9;     // 稍微放慢速度，適合學習
            window.speechSynthesis.speak(utterance);
        }

        // 取得隨機不重複單字
        function getRandomVocab(level, count = 3) {
            const list = vocabDatabase[level];
            if (!list || list.length === 0) return [];
            
            // 拷貝陣列以避免改動原始資料
            let shuffled = [...list].sort(() => 0.5 - Math.random());
            // 如果資料量不足 count，就回傳全部
            return shuffled.slice(0, Math.min(count, shuffled.length));
        }

        // 渲染卡片
        function renderCards() {
            const level = levelSelect.value;
            const vocabList = getRandomVocab(level, 3);
            
            cardsContainer.innerHTML = ''; // 清空現有卡片

            vocabList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'bg-white border border-gray-100 rounded-2xl p-5 shadow-sm card-hover flex flex-col gap-3';
                
                // 檢查此單字是否已在熟練名單中
                const isMastered = masteredWords.has(item.word);

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <p class="text-sm text-gray-500 mb-1 font-medium">${item.reading}</p>
                            <div class="flex items-center gap-3">
                                <h3 class="text-2xl font-bold text-gray-800">${item.word}</h3>
                                <button onclick="speak('${item.word}')" class="text-gray-400 hover:text-[#E2C792] transition-colors p-1" title="聆聽單字發音">
                                    🔊
                                </button>
                            </div>
                        </div>
                        <span class="bg-gray-100 text-gray-600 text-xs px-3 py-1 rounded-full font-medium">${item.meaning}</span>
                    </div>
                    
                    <div class="mt-2 bg-gray-50 rounded-xl p-4 relative border border-gray-100">
                        <div class="flex items-start gap-2">
                            <span class="text-[#E2C792] font-bold text-sm mt-0.5">例</span>
                            <div class="flex-1">
                                <p class="text-gray-700 text-md leading-relaxed">${item.example}</p>
                                <p class="text-gray-500 text-sm mt-1">${item.exampleMeaning}</p>
                            </div>
                            <button onclick="speak('${item.exampleAudio}')" class="text-gray-400 hover:text-[#E2C792] transition-colors p-1" title="聆聽例句發音">
                                🔊
                            </button>
                        </div>
                    </div>

                    <div class="mt-2 flex items-center justify-end border-t border-gray-50 pt-3">
                        <label class="flex items-center gap-2 cursor-pointer group">
                            <input type="checkbox" 
                                   class="mastered-checkbox w-4 h-4 accent-[#A3C1AD] bg-gray-100 border-gray-300 rounded cursor-pointer transition-transform active:scale-90"
                                   ${isMastered ? 'checked' : ''} 
                                   onchange="toggleMastered('${item.word}', this)">
                            <span class="text-sm text-gray-500 group-hover:text-gray-700 transition-colors select-none">已熟練</span>
                        </label>
                    </div>
                `;
                cardsContainer.appendChild(card);
            });
        }

        // 事件監聽
        nextBtn.addEventListener('click', renderCards);
        levelSelect.addEventListener('change', renderCards);

        // 初始載入
        updateProgressDisplay();
        renderCards();
    </script>
</body>
</html>
