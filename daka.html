<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Canmake 打卡系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6; /* Light gray background to make the app pop */
            -webkit-tap-highlight-color: transparent; /* Remove tap highlight on mobile */
        }
        .app-container {
            max-width: 480px; /* Mobile app width */
            margin: 0 auto;
            min-height: 100vh;
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
        }
        /* Custom scrollbar for records area */
        .records-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .records-scroll::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="app-container relative">
        
        <!-- Header / Title Area -->
        <div class="pt-10 pb-6 px-6 flex justify-center items-center bg-white rounded-b-3xl shadow-sm z-10">
             <h1 class="text-3xl font-bold text-orange-500 tracking-wider">每天愛打卡</h1>
        </div>

        <div class="flex flex-col items-center mt-8 mb-6 px-6">
            <div id="currentDate" class="text-gray-500 font-semibold text-sm mb-1">載入日期中...</div>
            <div class="flex items-baseline justify-center">
                <div id="currentTime" class="text-5xl font-bold text-gray-800 tracking-tight">00:00</div>
                <div id="currentSeconds" class="text-gray-400 font-medium text-2xl ml-1">00</div>
            </div>
        </div>

        <div class="px-6 flex gap-4 mb-8">
            <button onclick="addRecord('上班')" class="flex-1 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold py-5 rounded-2xl shadow-lg shadow-orange-500/30 transition duration-200 flex flex-col items-center justify-center gap-1 transform active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span class="text-xl">上班</span>
            </button>
            <button onclick="addRecord('下班')" class="flex-1 bg-gray-800 hover:bg-gray-900 active:bg-black text-white font-bold py-5 rounded-2xl shadow-lg shadow-gray-800/30 transition duration-200 flex flex-col items-center justify-center gap-1 transform active:scale-95">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 mb-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span class="text-xl">下班</span>
            </button>
        </div>

        <div class="flex-1 bg-gray-50 rounded-t-3xl px-6 pt-6 pb-6 shadow-inner flex flex-col">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-orange-500" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd" />
                    </svg>
                    打卡紀錄
                </h2>
                <button onclick="clearRecords()" class="text-sm font-medium text-red-500 hover:text-red-700 bg-red-50 px-3 py-1.5 rounded-full transition duration-200 flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    清除
                </button>
            </div>
            
            <div class="flex-1 overflow-y-auto records-scroll relative">
                <!-- Empty State -->
                <div id="emptyState" class="hidden absolute inset-0 flex flex-col items-center justify-center text-gray-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                    </svg>
                    <p>尚無打卡紀錄</p>
                </div>
                
                <!-- Records List -->
                <ul id="recordList" class="space-y-3 pb-4">
                    <!-- Javascript will populate this -->
                </ul>
            </div>
        </div>
    </div>

    <script>
        // Array to store records
        let records = [];

        // Initialize App
        function init() {
            startClock();
            loadRecords();
            renderRecords();
        }

        // Live Clock logic
        function startClock() {
            const dateEl = document.getElementById('currentDate');
            const timeEl = document.getElementById('currentTime');
            const secondsEl = document.getElementById('currentSeconds');
            
            const days = ['日', '一', '二', '三', '四', '五', '六'];

            setInterval(() => {
                const now = new Date();
                
                // Format Date: 2026年8月15日 (星期六)
                const year = now.getFullYear();
                const month = now.getMonth() + 1;
                const date = now.getDate();
                const dayName = days[now.getDay()];
                dateEl.textContent = `${year}年${month}月${date}日 (星期${dayName})`;

                // Format Time: 10:45
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                timeEl.textContent = `${hours}:${minutes}`;

                // Format Seconds: 30
                const seconds = String(now.getSeconds()).padStart(2, '0');
                secondsEl.textContent = `:${seconds}`;
            }, 1000);
        }

        // Add a new record
        function addRecord(type) {
            const now = new Date();
            const record = {
                id: Date.now(),
                type: type,
                time: now.toLocaleString('zh-TW', { hour12: false }), // e.g. 2026/8/15 10:45:30
                timestamp: now.getTime()
            };
            
            // Add to beginning of array
            records.unshift(record);
            saveRecords();
            renderRecords();
            
            // Visual feedback (optional)
            const btn = event.currentTarget;
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="text-xl">已${type}!</span>`;
            setTimeout(() => {
                btn.innerHTML = originalText;
            }, 1000);
        }

        // Load records from LocalStorage
        function loadRecords() {
            const saved = localStorage.getItem('canmake_clock_records');
            if (saved) {
                try {
                    records = JSON.parse(saved);
                } catch (e) {
                    console.error("Error parsing records", e);
                    records = [];
                }
            }
        }

        // Save records to LocalStorage
        function saveRecords() {
            localStorage.setItem('canmake_clock_records', JSON.stringify(records));
        }

        // Clear all records
        function clearRecords() {
            if (records.length === 0) return;
            
            // Replaced alert/confirm with custom logic (immediate clear for simplicity in POC)
            // In a production app, a custom modal would be better here.
            records = [];
            saveRecords();
            renderRecords();
        }

        // Render records to the DOM
        function renderRecords() {
            const listEl = document.getElementById('recordList');
            const emptyState = document.getElementById('emptyState');
            
            listEl.innerHTML = '';
            
            if (records.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                
                records.forEach(record => {
                    const li = document.createElement('li');
                    
                    // Determine styling based on type
                    const isClockIn = record.type === '上班';
                    const iconColor = isClockIn ? 'text-orange-500' : 'text-gray-600';
                    const bgColor = isClockIn ? 'bg-orange-100' : 'bg-gray-200';
                    const labelColor = isClockIn ? 'text-orange-700' : 'text-gray-700';

                    // Extract just the time part for prominent display
                    const timeOnly = new Date(record.timestamp).toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
                    const dateOnly = new Date(record.timestamp).toLocaleDateString('zh-TW');

                    li.className = 'bg-white p-4 rounded-xl shadow-sm border border-gray-100 flex items-center justify-between transform transition-all duration-300 animate-fade-in-up';
                    
                    li.innerHTML = `
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 ${bgColor} rounded-full flex items-center justify-center">
                                ${isClockIn 
                                    ? `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ${iconColor}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>` 
                                    : `<svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ${iconColor}" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>`
                                }
                            </div>
                            <div>
                                <span class="font-bold text-gray-800 text-lg block leading-tight">${timeOnly}</span>
                                <span class="text-xs text-gray-400 block">${dateOnly}</span>
                            </div>
                        </div>
                        <div class="px-3 py-1 rounded-md ${bgColor} ${labelColor} font-semibold text-sm">
                            ${record.type}
                        </div>
                    `;
                    listEl.appendChild(li);
                });
            }
        }

        // Add a simple animation class inline via DOMContentLoaded
        document.addEventListener('DOMContentLoaded', () => {
            const style = document.createElement('style');
            style.textContent = `
                @keyframes fadeInUp {
                    from { opacity: 0; transform: translateY(10px); }
                    to { opacity: 1; transform: translateY(0); }
                }
                .animate-fade-in-up {
                    animation: fadeInUp 0.3s ease-out forwards;
                }
            `;
            document.head.appendChild(style);
            
            // Start the app
            init();
        });
    </script>
</body>
</html>
